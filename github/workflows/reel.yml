
name: Make Reel
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Product URL"
        required: true
      dry_run:
        description: "Build only, don't post (true/false)"
        default: "true"

permissions:
  contents: write

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install requests beautifulsoup4 playwright
          playwright install --with-deps chromium
      - name: Build video
        run: python reel_bot.py build "${{ github.event.inputs.url }}"
      - name: Commit video (gives Instagram a public link)
        run: |
          git config user.name "reel-bot"
          git config user.email "bot@users.noreply.github.com"
          git add out
          git commit -m "reel ${{ github.run_id }}"
          git push
      - name: Publish to Instagram
        if: github.event.inputs.dry_run != 'true'
        run: python reel_bot.py publish
